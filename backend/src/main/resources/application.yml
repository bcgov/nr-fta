# General application
server:
  servlet:
    context-path: /
  error:
    include-message: always
  # SERVER_PORT is a placeholder so application-local.yml and the OpenShift env
  # var can override it. Set it to 8080 for local dev — Vite's dev server claims
  # 3000 and proxies /api to :8080 (frontend/vite.config.ts). The 3000 default
  # below is a leftover and will collide with Vite if SERVER_PORT is left unset.
  port: ${SERVER_PORT:3000}
  shutdown: graceful
  max-http-request-header-size: 16KB
  # Honor X-Forwarded-* from the Caddy reverse proxy when reconstructing the
  # request URL. Without this, Spring sees Host=fta-backend:8080 and the
  # browser-issued Origin=https://fta-a582fc-dev... is treated as cross-origin,
  # triggering a CORS allow-list check on every POST/PUT/DELETE.
  forward-headers-strategy: framework

# The search screens' code lists are cached in memory and the cache is cleared on
# this interval (ISO-8601 duration), so code-table edits show up within one
# interval without a restart. See CodeListCacheConfiguration.
fta:
  code-lists:
    cache-eviction: ${FTA_CODE_LIST_CACHE_EVICTION:PT1H}
  # nr-user-lookup-api — the shared BC Gov IDIR directory that turns the IDIR\USERNAME values
  # in FTA's audit columns into people's names on screen (see user/UserLookupClient). Calls
  # authenticate with FTA's own Keycloak client_credentials service account in the *forests*
  # realm (token-url), not the caller's token. All optional, so PR previews (which skip the service-account step) and local runs
  # still start — names just show as their IDIR ids. Set token-url/client-id/client-secret
  # together or none; a partial set fails at startup.
  user-lookup:
    base-url: ${USER_LOOKUP_BASE_URL:}
    token-url: ${USER_LOOKUP_TOKEN_URL:}
    client-id: ${USER_LOOKUP_CLIENT_ID:}
    client-secret: ${USER_LOOKUP_CLIENT_SECRET:}
    # Optional — the lookup scope is a DEFAULT client scope on the service account.
    scope: ${USER_LOOKUP_SCOPE:}
    connect-timeout: 5s
    read-timeout: 10s
    # How long a resolved name is kept in memory (ISO-8601 duration).
    cache-ttl: ${USER_LOOKUP_CACHE_TTL:PT12H}
  # The FTA402 certificate's signatures (see mark/service/CertificateSignatories): a folder
  # holding signatures.zip (as deployed, from GitHub secrets; see the README) or, locally, the
  # signatories.properties and images themselves. Never kept in git (this repo is public).
  # Unset, or a missing folder, prints the certificate with a blank signature line.
  certificate:
    signatures-dir: ${CERTIFICATE_SIGNATURES_DIR:}
  # APT report batches (Generate PDFs for all MUs / regions): how many PDFs render at once, each
  # on its own database connection. Keep it well under the Hikari pool size (10).
  apt-reports:
    batch-threads: ${APT_REPORT_BATCH_THREADS:4}
  # Issue Permit (Tenure application tab) files the permit PDF and e-mails the recipients, as
  # legacy FTA950 did through NRS DMS and NRS Common Messaging. Here: an S3-compatible bucket
  # (integration/S3DocumentStore) and plain SMTP (integration/SmtpEmailSender; the relay is
  # spring.mail below). All optional so the app starts without them; unset, Issue Permit fails
  # with a message naming the variables (documents), or issues the permit and reports the e-mail
  # as not sent (no FTA_EMAIL_FROM).
  documents:
    s3:
      # The S3-compatible endpoint (path-style access), e.g. BC Gov object storage.
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:}
      access-key-id: ${S3_ACCESS_KEY_ID:}
      secret-access-key: ${S3_SECRET_ACCESS_KEY:}
      region: ${S3_REGION:ca-central-1}
      # How long the e-mailed (presigned) link to an issued permit works, ISO-8601. SigV4 allows
      # at most P7D. The permit records the object's stable address, not this link.
      link-expiry: ${S3_LINK_EXPIRY:P7D}
  email:
    # The sender address. Set in the deploy only; unset, every send fails as not configured.
    from: ${FTA_EMAIL_FROM:}
  # Legacy FTA's batch jobs, scheduled in every pod and run by one at a time (ShedLock,
  # THE.FTA_SHEDLOCK). See the ca.bc.gov.nrs.fta.batch package documentation for the pattern.
  # Each job's cron is a Spring 6-field cron (sec min hour day month weekday) read in
  # America/Vancouver time; "-" disables the schedule. The schedules are set on the pods only,
  # through the optional ConfigMap nr-fta-backend-batch-schedules-<zone> (see
  # openshift.deploy.yml), never in Git. Any job can also be run on demand
  # (FTA_ADMIN): POST /api/fta/admin/batch/<job>/run.
  batch:
    # The id scheduled runs are recorded under (legacy batch.user). No batch package takes it.
    user-id: ${FTA_BATCH_USER_ID:IDIR\SA_FTA}
    # FTA_102_RANGE_REPLACE: applies pending range tenure replacements (the package acts only on
    # what is due). Legacy (Automate) runs it nightly just after midnight. Off unless
    # FTA_BATCH_RANGE_REPLACE_CRON is set on the pods.
    range-replace:
      cron: ${FTA_BATCH_RANGE_REPLACE_CRON:-}
    # FTA_520_CANCEL_MARK: cancels private marks (B08/B09/B14) expired over 90 days and not
    # extended. No e-mail. Legacy (Automate) runs it nightly at 22:00. Off unless
    # FTA_BATCH_CANCEL_MARK_CRON is set on the pods.
    cancel-mark:
      cron: ${FTA_BATCH_CANCEL_MARK_CRON:-}

spring:
  # Issue Permit's upload: legacy refused files of 4 MB (4,194,304 bytes) or more with its own
  # message, so the servlet limit sits just above that and the app's check speaks first.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: fta-backend
  # Outgoing e-mail (integration/SmtpEmailSender): straight to the government SMTP relay on its
  # default port, which takes mail from the cluster without a login.
  mail:
    host: apps.smtp.gov.bc.ca
    port: 25
    default-encoding: UTF-8
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 30000
      mail.smtp.writetimeout: 30000
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          # BC Gov SSO (Keycloak) standard realm, e.g.
          #   https://test.loginproxy.gov.bc.ca/auth/realms/standard
          # Note the JWKS path: Keycloak publishes its keys at
          # /protocol/openid-connect/certs, NOT the /.well-known/jwks.json that
          # Cognito used.
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs
  # Datasource is intentionally left un-configured for the POC. The application will expect
  # environment-specific JDBC settings (e.g. Oracle) to be provided at runtime. Flyway and
  # Postgres-specific settings were removed for this POC.
  jpa:
    show-sql: false

  mvc:
    problemdetails:
      enabled: true
  sleuth:
    propagation-keys:
      - X-TRACE-ID
      - X-USER
    baggage-keys:
      - X-TRACE-ID
      - X-USER
    log:
      slf4j:
        whitelisted-mdc-keys:
          - X-TRACE-ID
          - X-USER
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

# Actuator and ops
management:
  enable-native-support: true
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    metrics:
      enabled: false
    health:
      show-details: always
  health:
    # Actuator would otherwise open an SMTP connection on every health check, and an unreachable
    # relay would mark the pod down. A failed send is reported where it happens instead.
    mail:
      enabled: false

# Application metadata (consumed by FtaMetricConfiguration + Actuator /info endpoint)
info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    zone: ${APP_ZONE:local}

resilience4j:
  circuitbreaker:
    instances:
      breaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      apiRetry:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - ca.bc.gov.nrs.fta.exception.RetriableException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - ca.bc.gov.nrs.fta.exception.TooManyRequestsException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - ca.bc.gov.nrs.fta.exception.UnretriableException



# Certificate for the Database
ca:
  bc:
    gov:
      nrs:
        self-uri: http://localhost:3000
        keycloak:
          # The CSS integration's client id. Tokens must carry it as `azp` or
          # they are refused — see Oauth2SecurityCustomizer. Required: a blank
          # value would accept every token the realm signs, for any client.
          client-id: ${KEYCLOAK_CLIENT_ID}
        frontend:
          url: http://localhost:3000
          cors:
            headers:
              - x-requested-with
              - X-REQUESTED-WITH
              - authorization
              - Authorization
              - Content-Type
              - content-type
              - credential
              - CREDENTIAL
              - X-XSRF-TOKEN
              - access-control-allow-origin
              - Access-Control-Allow-Origin
              - DNT
              - Keep-Alive,
              - User-Agent,
              - X-Requested-With,
              - If-Modified-Since,
              - Cache-Control,
              - Content-Range,
              - Range
              - Location
              - location
            methods:
              - OPTIONS
              - GET
              - POST
              - PUT
              - DELETE
            age: 5m

# Logging — Spring Boot default stack (SLF4j + Logback).
#
# Per-category levels default to INFO; override at runtime via env vars
# (Spring's relaxed binding maps UPPERCASE_WITH_UNDERSCORES → dot.case):
#   APP_LOG_LEVEL                              → ca.bc.gov.nrs.fta
#   HIKARI_LOG_LEVEL                           → com.zaxxer.hikari
#   HIBERNATE_SQL_LOG_LEVEL                    → org.hibernate.SQL
#   HIBERNATE_BIND_LOG_LEVEL                   → org.hibernate.orm.jdbc.bind
#   HIBERNATE_CONNECTIONS_LOG_LEVEL            → org.hibernate.engine.jdbc.connections
#   ORACLE_JDBC_LOG_LEVEL                      → oracle.jdbc
#   LOGGING_LEVEL_ROOT                         → root logger
#   LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY → Spring Security
#
# Console pattern includes X-TRACE-ID and X-USER MDC keys populated by the
# request filter, plus PID and app name. To switch to structured JSON output
# (e.g. in containers), set the env var directly:
#   LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs   (Elastic Common Schema)
#   LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash
# Setting it via relaxed binding lets Spring Boot 3.4+ install the right
# structured layout. Don't wire an empty-default placeholder here — Spring
# treats "" as "structured logging on, no format" and fails layout init.
logging:
  level:
    ca.bc.gov.nrs.fta: ${APP_LOG_LEVEL:INFO}
    com.zaxxer.hikari: ${HIKARI_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:INFO}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_BIND_LOG_LEVEL:INFO}
    org.hibernate.engine.jdbc.connections: ${HIBERNATE_CONNECTIONS_LOG_LEVEL:INFO}
    oracle.jdbc: ${ORACLE_JDBC_LOG_LEVEL:INFO}
    # Suppress Hibernate 6's "Database info: ... undefined/unknown ..." block.
    # Those fields read as undefined when Spring (not Hibernate) owns the
    # HikariCP pool, so the line is noise rather than diagnostic.
    org.hibernate.orm.connections.pooling: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name}] [%X{X-TRACE-ID:-},${PID:-}] [%t] %logger:%L - %m%n%wEx"
