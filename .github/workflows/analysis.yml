name: Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 11 * * 0" # 3 AM PST = 12 PM UDT, runs sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend-tests:
    name: Backend Tests
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # Job-level so the Sonar step's `if` can test it: secrets can't be used in
    # `if:` directly, and GitHub's documented pattern is a job-level env var.
    env:
      SONAR_TOKEN: ${{ secrets.sonar_token }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Sonar uses git blame for new-code detection; shallow clones break it.
          fetch-depth: 0

      - name: Set up Java 21 (Temurin) + Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # `-DskipITs` skips the failsafe-bound integration tests (Oracle/Jasper
      # end-to-end checks via TestContainers). Surefire still runs all
      # *Test.java unit tests, and the `coverage` profile (default-on in
      # pom.xml) wires Jacoco's prepare-agent + report executions, so a
      # jacoco.xml ends up in target/site/jacoco/ for Sonar to consume.
      - name: Maven verify (unit tests + jacoco coverage)
        working-directory: backend
        run: mvn -B -DskipITs verify

      # Sonar is gated on the secret being present so PRs from forks (which
      # don't get secrets) don't fail.
      #
      # ONE analysis for the whole repository, published to bcgov_nr-fta.
      # SonarCloud has a single project per repo here, matching the siblings
      # (bcgov_nr-rept, bcgov_nr-fsp), and two analyses against one key replace
      # each other rather than combining — which is why the frontend job below
      # runs no scan of its own.
      #
      # Deliberately the standalone scanner from the REPOSITORY ROOT, not
      # `mvn sonar:sonar` in backend/. The Maven scanner resolves sonar.sources
      # against its own module directory, so repo-root paths turned into
      # `backend/backend/src/main/java` and failed the build; it also picks up
      # `sonar.language=java` from pom.xml, which drops frontend/src from the
      # analysis. The root scanner has neither problem and covers both
      # languages in one pass.
      #
      # It runs after `Maven verify` on purpose: Java analysis reads the
      # compiled classes in backend/target/classes, and coverage comes from the
      # jacoco report that step writes.
      #
      # Requires Automatic Analysis to be OFF for this project in SonarCloud
      # (Administration → Analysis Method). SonarCloud refuses CI uploads while
      # it is on, and Automatic Analysis cannot analyse Java at all.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=bcgov_nr-fta
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.sources=backend/src/main/java,frontend/src
            -Dsonar.tests=backend/src/test
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/target/**,**/*.test.ts,**/*.test.tsx,**/e2e/**
            -Dsonar.sourceEncoding=UTF-8

  frontend-tests:
    name: Frontend Tests
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No sonar_token/sonar_args here on purpose: the backend job runs the
      # single repo-wide analysis against bcgov_nr-fta and already includes
      # frontend/src. Passing a token here would publish a second analysis to
      # the same project key, which replaces the first rather than adding to
      # it. This job runs the checks; it does not report to Sonar.
      - uses: bcgov/action-test-and-analyse@8f699e3fd3fadd9a6adf6f4b1f2638ef7ecfefb9 # v2.0.0
        with:
          # `lint` is ESLint only — Prettier is deliberately not run through it
          # (see frontend/eslint.config.js), so formatting gets its own step.
          # `typecheck` is the real type gate; `test:coverage` is currently a
          # placeholder (no unit-test framework — coverage is the Playwright
          # e2e suite, run separately by reusable-tests.yml).
          commands: |
            npm ci
            npm run lint
            npm run format:check
            npm run typecheck
            npm run test:coverage
          dir: frontend
          node_version: "22"
          dep_scan: warn
          supply_scan: true
          triggers: ('frontend/')

  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: (! github.event.pull_request.draft)
    continue-on-error: true
    permissions:
      security-events: write
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Cache Trivy DB
        uses: actions/cache@v5
        with:
          path: .trivycache
          key: ${{ runner.os }}-trivy-v0.36.0-cache-v1
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          trivyignores: ".github/.trivyignore"
          cache-dir: .trivycache
          skip-dirs: "**/node_modules,**/coverage,**/dist,.git"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  results:
    name: Analysis Results
    needs: [backend-tests, frontend-tests]
    if: always() && (! github.event.pull_request.draft)
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure')||contains(needs.*.result, 'canceled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
