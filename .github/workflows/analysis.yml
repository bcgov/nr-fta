name: Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 11 * * 0" # 3 AM PST = 12 PM UDT, runs sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend-tests:
    name: Backend Tests
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Sonar uses git blame for new-code detection; shallow clones break it.
          fetch-depth: 0

      - name: Set up Java 21 (Temurin) + Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # `-DskipITs` skips the failsafe-bound integration tests (Oracle/Jasper
      # end-to-end checks via TestContainers). Surefire still runs all
      # *Test.java unit tests, and the `coverage` profile (default-on in
      # pom.xml) wires Jacoco's prepare-agent + report executions, so a
      # jacoco.xml ends up in target/site/jacoco/ for Sonar to consume.
      - name: Maven verify (unit tests + jacoco coverage)
        working-directory: backend
        run: mvn -B -DskipITs verify

      # Sonar is gated on the secret being present so PRs from forks (which
      # don't get secrets) don't fail.
      #
      # No SonarCloud step here, matching nr-rept.
      #
      # SonarCloud scans this repo with AUTOMATIC ANALYSIS, which runs on
      # SonarCloud's side when commits land — nothing in CI uploads to it, and
      # it refuses CI uploads while it is enabled. bcgov_nr-rept works the same
      # way (its `SonarCloud scan` step is skipped on every run).
      #
      # The trade-off, should anyone want to revisit it: Automatic Analysis
      # cannot analyse Java and cannot import coverage, so it covers the
      # frontend only. Swapping to a CI scan means disabling Automatic Analysis
      # in SonarCloud (Administration → Analysis Method) and adding the
      # standalone scanner at the repo root — the Maven scanner can't do it,
      # since it resolves sources against backend/ and honours the
      # sonar.language=java pin in pom.xml.

  frontend-tests:
    name: Frontend Tests
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No sonar_token/sonar_args here on purpose: the backend job runs the
      # single repo-wide analysis against bcgov_nr-fta and already includes
      # frontend/src. Passing a token here would publish a second analysis to
      # the same project key, which replaces the first rather than adding to
      # it. This job runs the checks; it does not report to Sonar.
      - uses: bcgov/action-test-and-analyse@8f699e3fd3fadd9a6adf6f4b1f2638ef7ecfefb9 # v2.0.0
        with:
          # `lint` is ESLint only — Prettier is deliberately not run through it
          # (see frontend/eslint.config.js), so formatting gets its own step.
          # `typecheck` is the real type gate; `test:coverage` is currently a
          # placeholder (no unit-test framework — coverage is the Playwright
          # e2e suite, run separately by reusable-tests.yml).
          commands: |
            npm ci
            npm run lint
            npm run format:check
            npm run typecheck
            npm run test:coverage
          dir: frontend
          node_version: "22"
          dep_scan: warn
          supply_scan: true
          triggers: ('frontend/')

  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: (! github.event.pull_request.draft)
    continue-on-error: true
    permissions:
      security-events: write
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Cache Trivy DB
        uses: actions/cache@v5
        with:
          path: .trivycache
          key: ${{ runner.os }}-trivy-v0.36.0-cache-v1
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          trivyignores: ".github/.trivyignore"
          cache-dir: .trivycache
          skip-dirs: "**/node_modules,**/coverage,**/dist,.git"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  results:
    name: Analysis Results
    needs: [backend-tests, frontend-tests]
    if: always() && (! github.event.pull_request.draft)
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure')||contains(needs.*.result, 'canceled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
